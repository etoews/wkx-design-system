<!-- @dsCard group="Status" height=90 -->
<!doctype html>
<html lang="en-NZ">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--ground);} #root{padding:1.3rem;}</style>
</head>
<body>
<div id="root" class="wkx-root"></div>
<script>
  var W = window.WKX, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(W.Legend, { label: 'Status key', items: [
      { status: 'good', term: 'up', meaning: 'all well' },
      { status: 'caution', term: 'settling', meaning: 'look if it lingers' },
      { status: 'danger', term: 'down', meaning: 'act now' },
      { status: 'off', term: 'off', meaning: 'not yet running' }
    ] }));
</script>
</body>
</html>
