<!doctype html>

<title>WKX</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .accent { fill:var(--accent); }

  .danger { fill:var(--danger); }
  .blk { rx:var(--radius-lg); }
  .d-good { fill:var(--accent); }
  .d-caution { fill:var(--caution); }
  .d-danger { fill:var(--danger); }
  .off { fill:none; stroke:var(--ink-muted); stroke-width:1.5; }

  .name { margin:0; font-family:var(--font-condensed); font-size:120px; line-height:.92; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-strong); }

</style>

<div class="cover">
<div class="words">
<p class="name">WKX</p>
<p class="tag">A calm console: colour only where there is signal.</p>

  scales      gutters and pitch space-6; corners radius-lg; disc diameter light-size; off rings 1.5px in ink-muted
-->
